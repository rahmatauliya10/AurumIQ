services:
  postgres:
    image: postgres:16-alpine
    container_name: xaut_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xaut_db}
      POSTGRES_USER: ${POSTGRES_USER:-xaut_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xaut_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xaut_user} -d ${POSTGRES_DB:-xaut_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xaut_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: xaut_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=dev-insecure-secret-key-replace-in-production-long-random-string
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web,0.0.0.0
      - DATABASE_URL=postgres://xaut_user:xaut_password@postgres:5432/xaut_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOG_FORMAT=console
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: xaut_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l info -Q market_data,analysis,backtest,machine_learning,maintenance -c 4
    volumes:
      - ..:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=dev-insecure-secret-key-replace-in-production-long-random-string
      - DATABASE_URL=postgres://xaut_user:xaut_password@postgres:5432/xaut_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOG_FORMAT=console
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: xaut_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ..:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=dev-insecure-secret-key-replace-in-production-long-random-string
      - DATABASE_URL=postgres://xaut_user:xaut_password@postgres:5432/xaut_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOG_FORMAT=console
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
