{% extends "dashboard/base.html" %}

{% block content %}
<div class="analysis-container">
    <div id="data-gap-alert-container" class="data-gap-alert-container" style="display: none;"></div>

    <div class="chart-controls-bar card">
        <div class="tf-selector">
            <span class="control-label">TIMEFRAME:</span>
            <a href="?tf=15m" class="tf-btn {% if selected_timeframe == '15m' %}active{% endif %}">15M</a>
            <a href="?tf=1h" class="tf-btn {% if selected_timeframe == '1h' %}active{% endif %}">1H</a>
            <a href="?tf=4h" class="tf-btn {% if selected_timeframe == '4h' %}active{% endif %}">4H</a>
            <a href="?tf=1d" class="tf-btn {% if selected_timeframe == '1d' %}active{% endif %}">1D</a>
        </div>
        <div class="overlay-legend">
            <span class="legend-item"><span class="legend-box entry-box"></span> Entry Zone</span>
            <span class="legend-item"><span class="legend-box stop-box"></span> Invalidation Stop</span>
            <span class="legend-item"><span class="legend-box tp-box"></span> Structural TP</span>
        </div>
    </div>

    <section class="card chart-card">
        <div id="plotly-chart-container" style="width: 100%; height: 600px;"></div>
        <div id="chart-loading" class="chart-loading-overlay">
            <div class="spinner"></div>
            <span>Loading XAU/USD {{ selected_timeframe|upper }} Chart Data...</span>
        </div>
    </section>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const tf = "{{ selected_timeframe }}";
        fetch(`/dashboard/api/chart/${tf}/?limit=120`)
            .then(res => res.json())
            .then(data => {
                const loading = document.getElementById("chart-loading");
                if (loading) loading.style.display = "none";

                if (!data.timestamps || data.timestamps.length === 0) {
                    document.getElementById("plotly-chart-container").innerHTML = "<div class='no-data-msg'>No closed candle data available for timeframe " + tf + ".</div>";
                    return;
                }

                const trace = {
                    x: data.timestamps,
                    close: data.close,
                    decreasing: {line: {color: '#ef4444'}},
                    high: data.high,
                    increasing: {line: {color: '#10b981'}},
                    low: data.low,
                    open: data.open,
                    type: 'candlestick',
                    xaxis: 'x',
                    yaxis: 'y',
                    name: 'XAU/USD ' + tf.toUpperCase()
                };

                const shapes = [];
                const annotations = [];
                const overlays = data.overlays || {};
                
                // Overlay Entry Zone
                if (overlays.entry_min && overlays.entry_max) {
                    shapes.push({
                        type: 'rect',
                        xref: 'paper',
                        yref: 'y',
                        x0: 0,
                        x1: 1,
                        y0: overlays.entry_min,
                        y1: overlays.entry_max,
                        fillcolor: 'rgba(217, 119, 6, 0.15)',
                        line: {color: '#d97706', width: 1, dash: 'dot'}
                    });
                }

                // Overlay Stop Loss
                if (overlays.stop_final) {
                    shapes.push({
                        type: 'line',
                        xref: 'paper',
                        yref: 'y',
                        x0: 0,
                        x1: 1,
                        y0: overlays.stop_final,
                        y1: overlays.stop_final,
                        line: {color: '#dc2626', width: 1.5, dash: 'dash'}
                    });
                }

                // Overlay TP1
                if (overlays.tp1) {
                    shapes.push({
                        type: 'line',
                        xref: 'paper',
                        yref: 'y',
                        x0: 0,
                        x1: 1,
                        y0: overlays.tp1,
                        y1: overlays.tp1,
                        line: {color: '#059669', width: 1.5, dash: 'dash'}
                    });
                }

                // Discontinuity processing:
                // Only PROVIDER_MARKET_CLOSURE may be visually collapsed via Plotly rangebreaks.
                // INTRASESSION_DATA_GAP must NEVER be collapsed; it remains visible with explicit warning.
                const rangebreaks = [];
                const intrasessionGaps = [];

                if (data.gaps && Array.isArray(data.gaps)) {
                    data.gaps.forEach(g => {
                        if (g.classification === "PROVIDER_MARKET_CLOSURE") {
                            rangebreaks.push({
                                bounds: [g.prev_close, g.next_open]
                            });
                        } else {
                            intrasessionGaps.push(g);
                        }
                    });
                } else if (data.timestamps && data.timestamps.length >= 2) {
                    // Client-side fallback classifier
                    const tfMinutesMap = { '15m': 15, '1h': 60, '4h': 240, '1d': 1440 };
                    const expectedIntervalMinutes = tfMinutesMap[tf] || 15;
                    const maxAllowedGapMinutes = expectedIntervalMinutes * 1.5;

                    for (let i = 1; i < data.timestamps.length; i++) {
                        const prevCloseStr = (data.timestamps_close && data.timestamps_close[i - 1])
                            ? data.timestamps_close[i - 1]
                            : data.timestamps[i - 1];
                        const currOpenStr = data.timestamps[i];

                        const tPrevClose = new Date(prevCloseStr);
                        const tCurrOpen = new Date(currOpenStr);
                        const diffMs = tCurrOpen.getTime() - tPrevClose.getTime();
                        const gapMinutes = diffMs / 60000;

                        if (gapMinutes > maxAllowedGapMinutes) {
                            const wClose = tPrevClose.getUTCDay(); // 0=Sun, 5=Fri, 6=Sat
                            const wOpen = tCurrOpen.getUTCDay();
                            const isWeekend = (wClose === 5 || wClose === 6) && (wOpen === 0 || wOpen === 1);

                            if (isWeekend && gapMinutes >= 1200 && gapMinutes <= 3900) {
                                rangebreaks.push({
                                    bounds: [prevCloseStr, currOpenStr]
                                });
                            } else {
                                const missed = Math.max(0, Math.floor(gapMinutes / expectedIntervalMinutes) - 1);
                                intrasessionGaps.push({
                                    prev_close: prevCloseStr,
                                    next_open: currOpenStr,
                                    missed_intervals: missed,
                                    classification: "INTRASESSION_DATA_GAP"
                                });
                            }
                        }
                    }
                }

                // Render intrasession data gap alerts
                const gapAlertContainer = document.getElementById("data-gap-alert-container");
                if (gapAlertContainer && intrasessionGaps.length > 0) {
                    gapAlertContainer.innerHTML = intrasessionGaps.map(g => `
                        <div class="data-gap-banner">
                            <span class="gap-icon">⚠️</span>
                            <span class="gap-title">DATA GAP:</span>
                            <span class="gap-details">${g.missed_intervals} missing ${tf.toUpperCase()} interval(s) (${g.prev_close.replace('T', ' ').slice(0, 16)} to ${g.next_open.replace('T', ' ').slice(0, 16)} UTC)</span>
                        </div>
                    `).join('');
                    gapAlertContainer.style.display = "block";

                    // Annotate missing data regions on chart canvas
                    intrasessionGaps.forEach(g => {
                        shapes.push({
                            type: 'rect',
                            xref: 'x',
                            yref: 'paper',
                            x0: g.prev_close,
                            x1: g.next_open,
                            y0: 0,
                            y1: 1,
                            fillcolor: 'rgba(239, 68, 68, 0.08)',
                            line: { color: 'rgba(239, 68, 68, 0.5)', width: 1, dash: 'dot' }
                        });
                        annotations.push({
                            xref: 'x',
                            yref: 'paper',
                            x: g.next_open,
                            y: 0.96,
                            text: `⚠️ Data Gap: ${g.missed_intervals} bars missing`,
                            showarrow: false,
                            font: { color: '#ef4444', size: 10, family: 'JetBrains Mono, monospace' },
                            bgcolor: 'rgba(24, 24, 27, 0.9)',
                            bordercolor: '#ef4444',
                            borderwidth: 1
                        });
                    });
                }

                const layout = {
                    dragmode: 'zoom',
                    margin: {r: 20, t: 25, b: 40, l: 60},
                    showlegend: false,
                    xaxis: {
                        autorange: true,
                        title: 'Time (UTC)',
                        type: 'date',
                        rangeslider: {visible: false},
                        gridcolor: '#27272a',
                        color: '#a1a1aa',
                        rangebreaks: rangebreaks
                    },
                    yaxis: {
                        autorange: true,
                        type: 'linear',
                        gridcolor: '#27272a',
                        color: '#a1a1aa'
                    },
                    paper_bgcolor: '#121214',
                    plot_bgcolor: '#121214',
                    shapes: shapes,
                    annotations: annotations
                };

                Plotly.newPlot('plotly-chart-container', [trace], layout, {responsive: true, displayModeBar: true});
            })
            .catch(err => {
                console.error("Error loading chart:", err);
                const loading = document.getElementById("chart-loading");
                if (loading) loading.innerHTML = "<span>Failed to load chart data.</span>";
            });
    });
</script>
{% endblock %}
